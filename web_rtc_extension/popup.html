<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Extension</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>WebRTC P2P</h1>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot disconnected"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- Connection Section -->
    <section class="section" id="connectionSection">
      <h2>Connection</h2>
      
      <!-- QR Code Display -->
      <div class="qr-container" id="qrContainer" style="display: none;">
        <h3>Scan this QR code with your Flutter app:</h3>
        <div id="qrCode"></div>
        <button class="btn btn-secondary" id="regenerateBtn">Regenerate QR</button>
        
        <!-- Manual Entry Option -->
        <div class="manual-entry-section" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
          <h4>Or paste the code manually:</h4>
          <div class="code-display-container">
            <textarea 
              id="compressedCodeDisplay" 
              readonly
              class="code-display"
              rows="4"
              placeholder="Compressed code will appear here..."
            ></textarea>
            <button class="btn btn-secondary" id="copyCodeBtn" style="margin-top: 8px;">
              <span id="copyCodeBtnText">Copy Code</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Answer Input -->
      <div class="answer-container" id="answerContainer" style="display: none;">
        <h3>Enter SDP Answer:</h3>
        <textarea 
          id="answerInput" 
          placeholder="Paste SDP answer JSON here or scan QR code"
          rows="6"
        ></textarea>
        <button class="btn btn-primary" id="submitAnswerBtn">Submit Answer</button>
      </div>

      <!-- Initial Actions -->
      <div class="actions" id="initialActions">
        <button class="btn btn-primary" id="createOfferBtn">Create Offer (Show QR)</button>
        <button class="btn btn-secondary" id="enterAnswerBtn">Enter Answer</button>
      </div>
    </section>

    <!-- Chat Section -->
    <section class="section" id="chatSection" style="display: none;">
      <h2>Chat</h2>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-container">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Type a message..."
          class="chat-input"
        />
        <button class="btn btn-primary" id="sendMessageBtn">Send</button>
      </div>
    </section>

    <!-- File Transfer Section -->
    <section class="section" id="fileSection" style="display: none;">
      <h2>File Transfer</h2>
      <div class="file-input-container">
        <input type="file" id="fileInput" class="file-input" />
        <button class="btn btn-primary" id="sendFileBtn" disabled>Send File</button>
      </div>
      <div class="file-progress" id="fileProgress" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressText">0%</span>
      </div>
      <div class="received-files" id="receivedFiles"></div>
    </section>

    <!-- Error Display -->
    <div class="error-message" id="errorMessage" style="display: none;"></div>
  </div>

  <!-- Scripts -->
  <script src="qrcode.min.js"></script>
  <script src="webrtc.js"></script>
  <script src="qr.js"></script>
  <script src="chat.js"></script>
  <script src="fileTransfer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
