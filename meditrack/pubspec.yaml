name: meditrack
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  super_tooltip: ^2.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Environment
  flutter_dotenv: ^5.1.0

  # SVG IMAGE LOAD
  flutter_svg: ^2.2.3

  # Locally manage images for fast load
  cached_network_image: ^3.4.1

  # Manage navigation
  go_router: ^17.0.0

  # Intro screen indicator
  smooth_page_indicator: ^1.2.1

  # Country code pick for sign up or profile
  country_code_picker: ^3.4.1

  # OTP Verify for auth
  otp_pin_field: ^1.4.1

  # show toast in app
  fluttertoast: ^9.0.0

  # WebView for loading web content
  webview_flutter: ^4.13.0

  # Image picker for media upload
  image_picker: ^1.1.2

  # Permission handler for managing app permissions
  permission_handler: ^11.3.1

  # Dotted border for UI elements
  dotted_border: ^2.1.0

  # Local database
  flutter_secure_storage: ^10.0.0

  # Local Database
  shared_preferences: ^2.5.3

  dropdown_search: ^6.0.2

  # Calender 
  table_calendar: ^3.2.0

  # graph
  syncfusion_flutter_charts: ^31.1.19

  azlistview: ^2.0.0


  blur: ^4.0.2
  
  # video player
  video_player: ^2.10.1


  share_plus: ^12.0.1

  # Local auth for Face ID & Fingure print
  local_auth: ^3.0.0

  # Firebase setup
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Notification for reminder
  flutter_local_notifications: ^20.0.0

  # Local Database
  drift: ^2.30.1
  sqlite3_flutter_libs: ^0.5.41
  drift_flutter: ^0.2.0
  sqlite3: ^2.5.0
  path_provider: ^2.1.2
  path: ^1.9.0
  timezone: ^0.10.0
  android_intent_plus: ^6.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  freezed: ^3.2.4
  json_serializable: ^6.8.0
  drift_dev: ^2.15.0
  build_runner: ^2.10.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # Assets
  assets:
    - config/env/
    - assets/translations/
    - assets/svg/
    - assets/img/

  # Fonts
  fonts:
    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/RedHatDisplay-Regular.ttf
        - asset: assets/fonts/RedHatDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/RedHatDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/RedHatDisplay-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/RedHatDisplay-Black.ttf
          weight: 900
        - asset: assets/fonts/RedHatDisplay-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/RedHatDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/RedHatDisplay-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/RedHatDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/RedHatDisplay-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/RedHatDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/RedHatDisplay-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/RedHatDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RedHatDisplay-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
